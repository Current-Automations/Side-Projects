<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardSnap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 120px;
      background: #111;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #27272a;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #f97316;
      letter-spacing: -0.3px;
    }
    .logo span { color: #e4e4e7; }

    /* ── Sections ── */
    .section {
      padding: 16px;
    }
    .section + .section {
      border-top: 1px solid #27272a;
    }

    /* ── Loading ── */
    #state-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 16px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #3f3f46;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #a1a1aa; font-size: 13px; }

    /* ── Result ── */
    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: #f4f4f5;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .price-label { font-size: 12px; color: #71717a; }
    .price-value {
      font-size: 26px;
      font-weight: 700;
      color: #f97316;
      letter-spacing: -0.5px;
    }
    .attribution {
      font-size: 11px;
      color: #52525b;
      margin-bottom: 12px;
    }

    .sales-heading {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .sales-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .sale-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #a1a1aa;
    }
    .sale-price { color: #d4d4d8; font-weight: 500; }
    .sale-date { color: #52525b; }

    .scans-remaining {
      font-size: 12px;
      color: #52525b;
      margin-bottom: 12px;
    }
    .scans-remaining strong { color: #a1a1aa; }

    /* ── Trend badge ── */
    .trend {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .trend-up    { background: #14532d; color: #4ade80; }
    .trend-down  { background: #450a0a; color: #f87171; }
    .trend-stable { background: #1c1c1e; color: #71717a; }
    .trend-new   { background: #172554; color: #60a5fa; }

    /* ── Correction form ── */
    .btn-link {
      background: none;
      border: none;
      color: #f97316;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .btn-link:hover { color: #fb923c; }

    .correction-form { display: flex; flex-direction: column; gap: 8px; }
    .correction-form label { font-size: 12px; color: #71717a; }
    .correction-form input {
      width: 100%;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      color: #f4f4f5;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
    }
    .correction-form input:focus { border-color: #f97316; }
    .correction-form input::placeholder { color: #52525b; }

    .btn-primary {
      background: #f97316;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      text-align: center;
      display: block;
      width: 100%;
    }
    .btn-primary:hover { background: #ea6c0c; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: #27272a;
      border: none;
      border-radius: 6px;
      color: #a1a1aa;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      display: block;
      width: 100%;
    }
    .btn-secondary:hover { background: #3f3f46; }

    /* ── Error ── */
    .error-icon { font-size: 22px; margin-bottom: 6px; }
    .error-title { font-size: 14px; font-weight: 600; color: #f87171; margin-bottom: 4px; }
    .error-body  { font-size: 12px; color: #71717a; line-height: 1.5; }

    /* ── Auth required / rate limit ── */
    .cta-title { font-size: 14px; font-weight: 600; color: #f4f4f5; margin-bottom: 6px; }
    .cta-body  { font-size: 12px; color: #71717a; margin-bottom: 14px; line-height: 1.5; }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .mt-8  { margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">Card<span>Snap</span></div>
  </div>

  <!-- Loading -->
  <div id="state-loading">
    <div class="spinner"></div>
    <span class="loading-text">Scanning card...</span>
  </div>

  <!-- Scan result -->
  <div id="state-result" class="hidden">
    <div class="section" id="result-main">
      <div id="result-card-name" class="card-name"></div>
      <div class="price-row">
        <span class="price-label">Avg sold</span>
        <span id="result-price" class="price-value"></span>
        <span id="result-trend" class="trend hidden"></span>
      </div>
      <div class="attribution" id="result-attribution"></div>
      <div id="sales-block" class="hidden">
        <div class="sales-heading">Recent sales</div>
        <ul id="result-sales" class="sales-list"></ul>
      </div>
      <div id="result-scans" class="scans-remaining hidden"></div>
      <button class="btn-link" id="btn-open-correction">Wrong card? Correct it</button>
    </div>

    <!-- Correction form -->
    <div class="section hidden" id="state-correction">
      <form class="correction-form" id="correction-form">
        <label for="correction-input">Correct card name</label>
        <input
          id="correction-input"
          type="text"
          placeholder="e.g. 2021 Panini Prizm Patrick Mahomes Base"
          autocomplete="off"
        />
        <button type="submit" class="btn-primary" id="btn-submit-correction">Submit</button>
        <button type="button" class="btn-secondary" id="btn-cancel-correction">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Rate limit exceeded -->
  <div id="state-rate-limit" class="hidden section">
    <div class="cta-title">Daily limit reached</div>
    <div class="cta-body">You've used all your scans for today. Upgrade to Pro for unlimited scans.</div>
    <a href="https://cardsnap.app/upgrade" target="_blank" class="btn-primary" style="text-decoration:none;">Upgrade to Pro</a>
  </div>

  <!-- Auth required -->
  <div id="state-auth" class="hidden section">
    <div class="cta-title">Sign in to scan</div>
    <div class="cta-body">Create a free account to start identifying and pricing your cards.</div>
    <a href="https://cardsnap.app/login" target="_blank" class="btn-primary" style="text-decoration:none;">Sign in / Sign up</a>
  </div>

  <!-- Error -->
  <div id="state-error" class="hidden section">
    <div class="error-icon">⚠</div>
    <div id="error-title" class="error-title"></div>
    <div id="error-body" class="error-body"></div>
  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
